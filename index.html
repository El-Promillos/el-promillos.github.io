<style>
/* Layout: schlichte schwarze Seite, Wappen in der Mitte, zwei Bierkrüge stoßen darunter an */
:root{
  --schwarz:#0e0f0b; --gelb:#f5c518; --creme:#f4ecd6; --grau:#8a8672;
  --marker:"Permanent Marker","Comic Sans MS",cursive;
  --cond:"Barlow Condensed","Arial Narrow",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--schwarz);color:var(--creme);font-family:var(--cond)}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;
  padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{width:min(260px,62vw);max-width:100%;height:auto}
h1{font-family:var(--marker);font-weight:400;color:var(--gelb);font-size:clamp(2.4rem,9vw,4.2rem);line-height:1;margin:0;transform:rotate(-2deg)}
.bald{font-size:1.2rem;letter-spacing:.3em;text-transform:uppercase;color:var(--creme);margin:0}
.prost{width:min(180px,46vw);height:auto;margin-top:6px}
.prost .l{transform-origin:70px 110px;animation:anstossen-l 3s ease-in-out infinite}
.prost .r{transform-origin:130px 110px;animation:anstossen-r 3s ease-in-out infinite}
@keyframes anstossen-l{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(8deg)}}
@keyframes anstossen-r{0%,60%,100%{transform:rotate(0)}75%{transform:rotate(-8deg)}}
footer{font-size:.9rem;letter-spacing:.12em;text-transform:uppercase;color:var(--grau)}
@media (prefers-reduced-motion:reduce){.prost g{animation:none}}
</style>
